name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every generated surface is rebuilt and compared before anything is deployed.
      # Order does not matter: each builder re-renders its own output in full,
      # including the shared chrome, so a stale file fails here rather than shipping.
      - name: Regenerated surfaces are current
        run: |
          python3 scripts/build_chrome.py --check
          python3 scripts/build_registers.py --check
          python3 scripts/build_decisions.py --check
          python3 scripts/build_products.py --check
          python3 scripts/build_sitemap.py --check

      - name: Release gate (structure, disclosure, sources)
        run: |
          python3 scripts/check_site.py
          python3 tools/verify_site.py
          python3 tools/check_site.py

      - name: Internal link and anchor crawl
        run: python3 tools/crawl_links.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
