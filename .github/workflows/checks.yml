name: Site checks

# Runs the same gate locally and in CI, from a clean checkout, with no
# dependencies installed. A red run here means a promise on /about/ or
# /dashboard/gate.html is not currently true of the built output.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: python3 build.py

      - name: Verify data integrity and policy rules
        run: python3 tools/check_site.py

      - name: Confirm the build is reproducible (rebuild produces no diff)
        run: |
          git add -A
          git diff --cached --exit-code --stat -- . \
            ':(exclude).github' \
            || (echo "::error::build output changed on rebuild — the committed HTML is stale" && exit 1)

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: |
            index.html
            **/*.html
            assets/
            sitemap.xml
            feed.xml
            robots.txt
          retention-days: 7
          if-no-files-found: error
